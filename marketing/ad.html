<!doctype html>
<!-- Molde dos banners de anúncio. Não abra direto: rode `npm run ads` (scripts/ads.mjs),
     que tira o print deste arquivo em cada tamanho. O conteúdo vem no #hash (JSON). -->
<html lang="pt-BR">
<meta charset="utf-8" />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@500;700&family=Zen+Kaku+Gothic+New:wght@900&display=block"
  rel="stylesheet"
/>
<style>
  /* tokens da marca, copiados de src/app/globals.css */
  :root {
    --grape: #4b2bd6;
    --grape-deep: #3a1cb8;
    --ink: #1d0d66;
    --lime: #c9f560;
    --lavender: #d9cffc;
    --track: #ede8ff;
    --muted: #5e4fa2;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 100vw; height: 100vh; overflow: hidden; position: relative;
    background: var(--grape); color: #fff; font-family: Figtree, sans-serif;
    display: flex; flex-direction: column; justify-content: center; gap: 4.5vmin;
    padding: 9vmin;
  }
  .kana {
    position: absolute; right: -4vmin; bottom: -9vmin; z-index: 0;
    font: 900 44vmin/1 "Zen Kaku Gothic New", sans-serif; color: var(--grape-deep); white-space: nowrap;
  }
  body > :not(.kana) { position: relative; z-index: 1; }
  .logo, h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; }
  .logo { font-size: 6vmin; letter-spacing: -0.03em; }
  .logo span { color: var(--lime); }
  h1 { font-size: 14vmin; line-height: 0.95; letter-spacing: -0.04em; text-wrap: balance; }
  h1.long { font-size: 9.5vmin; }
  h1 em { font-style: normal; color: var(--lime); }
  .card {
    background: #fff; color: var(--ink); border-radius: 5vmin; padding: 4.5vmin;
    box-shadow: 0 1.2vmin 0 rgba(19, 7, 73, 0.35);
    display: flex; flex-direction: column; gap: 3.5vmin;
  }
  .emojis { display: flex; justify-content: space-between; font-size: 14vmin; }
  .emojis img { width: 1em; height: 1em; }
  /* igual ao GuessInput do site: campo branco com contorno + botão lime "Chutar" */
  .guess { display: flex; gap: 2vmin; font-size: 3.8vmin; }
  .guess span {
    flex: 1; background: #fff; color: rgb(94 79 162 / 0.6); font-weight: 500; white-space: nowrap;
    border-radius: 99vmin; padding: 2.6vmin 4vmin; box-shadow: 0 0 0 0.25vmin rgb(75 43 214 / 0.2);
  }
  .guess b {
    background: var(--lime); color: var(--ink); font-weight: 700;
    border-radius: 99vmin; padding: 2.6vmin 5vmin;
    box-shadow: 0 0 0 1px rgb(75 43 214 / 0.1), 0 0.8vmin 0 rgb(19 7 73 / 0.3);
  }
  /* criativo "opening": play + equalizador */
  .player { display: flex; align-items: center; gap: 4vmin; }
  .play {
    flex: none; width: 17vmin; height: 17vmin; border-radius: 50%; background: var(--grape);
    display: grid; place-items: center;
  }
  .play::after {
    content: ""; margin-left: 1.5vmin;
    border: 4vmin solid transparent; border-left: 6.5vmin solid #fff; border-right: 0;
  }
  .bars { flex: 1; height: 17vmin; display: flex; align-items: center; gap: 1.4vmin; }
  .bars i { flex: 1; border-radius: 99vmin; background: var(--lavender); }
  .bars i.on { background: var(--grape); }
  .time { font: 800 6vmin "Bricolage Grotesque", sans-serif; }
  .sub { font-size: 4.4vmin; font-weight: 500; color: var(--lavender); line-height: 1.3; }
  .cta {
    align-self: flex-start; background: var(--lime); color: var(--ink); border-radius: 99vmin;
    padding: 2.6vmin 5.5vmin; font-size: 4.6vmin; font-weight: 700;
    box-shadow: 0 1vmin 0 rgba(19, 7, 73, 0.35);
  }

  /* Story/Reels 9:16 — topo e base livres (zona da interface do Instagram/TikTok) */
  @media (max-aspect-ratio: 3/4) {
    body { padding: 16vh 9vmin 22vh; gap: 6vmin; }
    .kana { bottom: 24vh; }
  }
  /* Quadrado 1:1 — mais apertado: sem o subtítulo (vai no texto do anúncio) */
  @media (min-aspect-ratio: 3/4) and (max-aspect-ratio: 3/2) {
    body { padding: 6vmin 8vmin; gap: 3.8vmin; }
    .sub { display: none; }
    h1 { font-size: 12.5vmin; }
    h1.long { font-size: 8.8vmin; }
    .card { padding: 4vmin; gap: 3vmin; }
    .emojis { font-size: 13vmin; }
    .play, .bars { height: 15vmin; }
    .play { width: 15vmin; }
  }
  /* Paisagem 1.91:1 — texto à esquerda, card à direita */
  @media (min-aspect-ratio: 3/2) {
    body {
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto;
      align-content: center; column-gap: 8vmin; row-gap: 4vmin; padding: 8vmin 9vmin;
    }
    .card { grid-column: 2; grid-row: 1 / 5; align-self: center; }
    .emojis { font-size: 16vmin; }
    .logo, h1, .sub, .cta { grid-column: 1; }
    h1 { font-size: 15vmin; }
    h1.long { font-size: 10.5vmin; }
    .sub { font-size: 4.3vmin; }
    .cta { font-size: 4.4vmin; white-space: nowrap; }
    .guess { font-size: 4.6vmin; }
    .kana { font-size: 60vmin; right: -6vmin; bottom: -14vmin; }
  }
</style>
<body>
  <div class="kana">アニメ</div>
  <div class="logo">aknewme<span>.</span></div>
  <h1 id="h"></h1>
  <div class="card" id="card"></div>
  <p class="sub">Desafio novo todo dia à meia-noite.<br />Grátis e sem cadastro.</p>
  <div class="cta">Jogar agora → aknewme.com</div>
  <script>
    const ad = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    const h = document.getElementById("h");
    const card = document.getElementById("card");
    if (ad.kind === "opening") {
      h.className = "long";
      h.innerHTML = "Reconhece o anime por <em>1 segundo</em> da abertura?";
      // alturas fixas (nada de Math.random: o banner tem que sair igual toda vez)
      const bars = [30, 55, 80, 45, 95, 60, 35, 75, 50, 90, 40, 65, 85, 30, 55, 70]
        .map((p, i) => `<i class="${i < 2 ? "on" : ""}" style="height:${p}%"></i>`).join("");
      card.innerHTML = `<div class="player"><div class="play"></div><div class="bars">${bars}</div><div class="time">0:01</div></div>`;
    } else {
      h.innerHTML = "Que anime <em>é esse?</em>";
      const emojis = document.createElement("div");
      emojis.className = "emojis";
      // Emojis da Apple (iPhone), como no site. O site só tem PNG de 64px (borra no banner):
      // busca o de 160px no repositório apple-emoji-linux e, se faltar, cai no de 64px do site.
      for (const e of ad.emojis) {
        const key = [...e].map((c) => c.codePointAt(0).toString(16)).filter((h) => h !== "fe0f");
        const img = emojis.appendChild(new Image());
        img.onerror = () => { img.onerror = null; img.src = `../public/emoji/${key.join("-")}.png`; };
        img.src = `https://raw.githubusercontent.com/samuelngs/apple-emoji-linux/ios-17.4/png/160/emoji_u${key.join("_")}.png`;
      }
      card.appendChild(emojis);
    }
    card.insertAdjacentHTML("beforeend", '<div class="guess"><span>Digite o nome do anime...</span><b>Chutar</b></div>');
  </script>
</body>
</html>
