<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Estilo B · Rodada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* tokens copiados de src/app/globals.css */
  :root {
    --grape: #4b2bd6; --grape-deep: #3a1cb8; --ink: #1d0d66; --lime: #c9f560;
    --lavender: #d9cffc; --track: #ede8ff; --blush: #ff9ebf; --sun: #ffe066; --paper: #ffffff; --muted: #5e4fa2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    font-family: "Figtree", system-ui, sans-serif; color: var(--ink); background: var(--lavender);
  }
  .stage { width: 100%; max-width: 380px; }
  .card {
    background: var(--paper); border-radius: 24px; padding: 26px 22px 22px; box-shadow: 0 18px 40px rgba(29,13,102,.18);
    animation: slide-in .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes slide-in { from { opacity: 0; transform: translateY(28px) scale(.97); } to { opacity: 1; transform: none; } }

  .brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 20px; color: var(--grape); margin: 0 0 14px; }

  /* cinco rodadas que se preenchem, como o placar do jogo */
  .rounds { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 18px; }
  .round { height: 12px; border-radius: 99px; background: var(--track); position: relative; overflow: hidden; }
  .round::after {
    content: ""; position: absolute; inset: 0; background: var(--grape); border-radius: inherit;
    transform: scaleX(0); transform-origin: left; animation: fill .4s ease-out forwards;
  }
  .round:nth-child(1)::after { animation-delay: .2s; }
  .round:nth-child(2)::after { animation-delay: .35s; background: var(--lime); }
  .round:nth-child(3)::after { animation-delay: .5s; }
  .round:nth-child(4)::after { animation-delay: .65s; background: var(--sun); }
  .round:nth-child(5)::after { animation-delay: .8s; background: var(--blush); }
  @keyframes fill { to { transform: scaleX(1); } }

  h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: 25px; line-height: 1.1; margin: 0 0 12px; }
  p.lead { margin: 0 0 16px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .perks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .perk { background: var(--track); color: var(--grape-deep); font-weight: 700; font-size: 13px; padding: 6px 10px; border-radius: 99px; }

  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px;
    border-radius: 14px; border: 0; font: 700 16px "Figtree", sans-serif; cursor: pointer; margin-bottom: 10px;
    opacity: 0; animation: enter .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .btn:nth-of-type(1) { animation-delay: .75s; }
  .btn:nth-of-type(2) { animation-delay: .9s; }
  .btn:nth-of-type(3) { animation-delay: 1.05s; }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .btn:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; }
  .google { background: var(--grape); color: #fff; }
  .discord { background: #5865f2; color: #fff; }
  .solo { background: transparent; color: var(--muted); font-weight: 500; font-size: 15px; min-height: 40px; }
  .tag { display: inline-block; margin-top: 14px; background: var(--ink); color: var(--lime); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 99px; }
  .tag-wrap { text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .card, .round::after, .btn { animation: none; opacity: 1; }
    .round::after { transform: scaleX(1); }
  }
</style>
</head>
<body>
  <main class="stage">
    <section class="card">
      <p class="brand">aknewme</p>
      <div class="rounds" aria-hidden="true"><span class="round"></span><span class="round"></span><span class="round"></span><span class="round"></span><span class="round"></span></div>
      <h1>Entre pra jogar com os amigos</h1>
      <p class="lead">Seu placar fica salvo, você duela com a galera e vê quem acertou mais.</p>
      <div class="perks">
        <span class="perk">Adicionar amigos</span>
        <span class="perk">Duelo em sala</span>
        <span class="perk">Histórico</span>
      </div>
      <button class="btn google" type="button">Entrar com Google</button>
      <button class="btn discord" type="button">Entrar com Discord</button>
      <button class="btn solo" type="button">Continuar sem entrar</button>
    </section>
    <div class="tag-wrap"><span class="tag">Protótipo · Estilo B (Rodada)</span></div>
  </main>
</body>
</html>
