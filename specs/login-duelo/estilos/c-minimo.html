<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · Style C · Minimal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* tokens copiados de src/app/globals.css */
  :root {
    --grape: #4b2bd6; --grape-deep: #3a1cb8; --ink: #1d0d66; --lime: #c9f560;
    --lavender: #d9cffc; --track: #ede8ff; --paper: #ffffff; --muted: #5e4fa2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    font-family: "Figtree", system-ui, sans-serif; color: var(--ink); background: var(--paper);
  }
  .stage { width: 100%; max-width: 360px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; color: var(--grape); margin: 0 0 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 var(--lime); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lime) 90%, transparent); } 100% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--lime) 0%, transparent); } }

  h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: 32px; line-height: 1.08; margin: 0 0 14px; letter-spacing: -.5px; }
  /* revelação com máscara: o título pode quebrar em linhas (digitação com largura fixa quebrava no celular) */
  .type { display: block; animation: reveal 1.1s cubic-bezier(.2,.8,.2,1) .3s both; }
  @keyframes reveal { from { clip-path: inset(0 100% 0 0); transform: translateX(-8px); } to { clip-path: inset(0 0 0 0); transform: none; } }
  .sub { margin: 0 0 26px; color: var(--muted); font-size: 16px; line-height: 1.45; }

  .list { border-top: 1px solid var(--track); margin: 0 0 24px; padding: 0; list-style: none; }
  .list li { padding: 12px 0; border-bottom: 1px solid var(--track); font-size: 15px; display: flex; justify-content: space-between; }
  .list li span { color: var(--muted); }

  .btn {
    position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px;
    border-radius: 12px; border: 2px solid var(--ink); font: 700 16px "Figtree", sans-serif; cursor: pointer; margin-bottom: 10px;
    background: var(--paper); color: var(--ink);
  }
  .btn:focus-visible { outline: 3px solid var(--grape); outline-offset: 3px; }
  .primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  /* brilho que passa no botão principal */
  .primary::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--lime) 55%, transparent), transparent); transform: skewX(-20deg);
    animation: shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  /* mesmo peso visual dos botões de login (U2): borda e 50 px */
  .solo { border-color: var(--lavender); background: var(--paper); color: var(--ink); font-weight: 700; font-size: 16px; min-height: 50px; }
  .solo:hover { border-color: var(--grape); color: var(--grape); }
  .tag { display: inline-block; margin-top: 22px; font-size: 12px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .dot, .primary::after, .type { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span> Sign-in is optional</p>
    <h1><span class="type">Sign in to play with friends.</span></h1>
    <p class="sub">Sign in to add friends, duel in rooms and keep your history.</p>
    <ul class="list">
      <li>Friends <span>by handle</span></li>
      <li>Duel rooms <span>up to 4 players</span></li>
      <li>Duel history <span>on any device</span></li>
    </ul>
    <button class="btn primary" type="button">Sign in with Google</button>
    <button class="btn" type="button">Sign in with Discord</button>
    <button class="btn solo" type="button">Continue without signing in</button>
    <p class="tag">Prototype · Style C (Minimal)</p>
  </main>
</body>
</html>
